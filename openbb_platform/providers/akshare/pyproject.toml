[tool.poetry]
name = "openbb-akshare"
version = "0.1.0"
description = "AKShare provider extension for OpenBB Platform"
authors = ["OpenBB User <user@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "openbb_akshare" }]

[tool.poetry.dependencies]
python = ">=3.10,<4"
akshare = ">=1.18.0"
openbb-core = ">=1.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."openbb_provider_extension"]
akshare = "openbb_akshare:akshare_provider"
